 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blume Perfume</title>

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #fff8e1; /* soft golden background */
      color: #333;
      text-align: center;
      margin: 0;
      padding: 0;
    }

    header {
      background-color: #ffd700; /* bright gold */
      padding: 20px;
    }

    header h1 {
      font-size: 28px;
      color: #4a3c00;
      margin: 0;
    }

    header p {
      color: #5a4a00;
      font-size: 14px;
      margin-top: 5px;
    }

    .slideshow-container {
      position: relative;
      max-width: 350px;
      margin: 30px auto;
    }

    .mySlides {
      display: none;
      width: 100%;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    h2 {
      font-size: 24px;
      color: #4a3c00;
      margin: 15px 0 5px;
    }

    p.description {
      font-size: 15px;
      color: #555;
      margin-bottom: 20px;
    }

    .price {
      font-size: 20px;
      color: #4a3c00;
      font-weight: bold;
      margin-bottom: 15px;
    }

    button {
      background-color: #c6a700; /* gold button */
      color: white;
      border: none;
      padding: 12px 25px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      transition: 0.3s;
    }

    button:hover {
      background-color: #b8860b; /* darker gold on hover */
    }

    footer {
      background-color: #fff3b0;
      padding: 15px;
      font-size: 14px;
      color: #555;
      margin-top: 40px;
    }
  </style>
</head>

<body>
  <header>
    <h1>💛 Blume Perfume</h1>
    <p>Luxury scents that define you</p>
  </header>

  <div class="slideshow-container">
    <img class="mySlides" src="perfume1.jpg" alt="Perfume Image 1">
    <img class="mySlides" src="perfume2.jpg" alt="Perfume Image 2">
  </div>

  <h2>Blume Rose Essence</h2>
  <p class="description">A delicate blend of rose, jasmine, and sandalwood.</p>
  <p class="price">₹699</p>

  <a href="https://wa.me/917892090261?text=Hey%20Mahroof!%20I%20want%20to%20order%201%20Blume%20Perfume%20bottle." target="_blank">
    <button>Add to Cart 🛒</button>
  </a>

  <footer>
    © 2025 Blume Perfume | Made with 💛 by Mahroof
  </footer>

  <script>
    let slideIndex = 0;
    showSlides();

    function showSlides() {
      let slides = document.getElementsByClassName("mySlides");
      for (let i = 0; i < slides.length; i++) {
        slides[i].style.display = "none";
      }
      slideIndex++;
      if (slideIndex > slides.length) { slideIndex = 1; }
      slides[slideIndex - 1].style.display = "block";
      setTimeout(showSlides, 5000); // change image every 5 seconds
    }
  </script>
</body>
</html>
